name = "goobercord"
main = "worker.mjs"
compatibility_date = "2026-10-13"
workers_dev = true

[vars]
TURNSTILE_HOSTNAMES = "goobercord.itswempo.workers.dev"
VERSION = "1.0.0"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Shared production D1: wempos-forum binds the same database_id as FORUM_DB.
# GooberCord reads/writes session, user, ban, and known-ip rows in that one
# database — the parity contract in tests/contract-parity.test.mjs keeps the
# two apps' SQL for those tables identical.
[[d1_databases]]
binding = "GOOBER_DB"
database_name = "wempo-forum-data"
database_id = "e648d306-2c2b-4ddc-aaf1-cef2e023a88c"
migrations_dir = "migrations"

# Rate limiters are GooberCord's own (binding names GC_*; ids in a fresh
# range), so the two apps never contend for each other's throttle.
[[ratelimits]]
name = "GC_READ_RATE_LIMITER"
namespace_id = "614202610143101"
[ratelimits.simple]
limit = 180
period = 60

[[ratelimits]]
name = "GC_WRITE_RATE_LIMITER"
namespace_id = "614202610143102"
[ratelimits.simple]
limit = 45
period = 60

[[ratelimits]]
name = "GC_GUEST_RATE_LIMITER"
namespace_id = "614202610143103"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "GC_REGISTER_RATE_LIMITER"
namespace_id = "614202610143104"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "GC_LOGIN_RATE_LIMITER"
namespace_id = "614202610143105"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "GC_MESSAGE_RATE_LIMITER"
namespace_id = "614202610143106"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "GC_UPLOAD_RATE_LIMITER"
namespace_id = "614202610143107"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "GC_PASSWORD_RATE_LIMITER"
namespace_id = "614202610143108"
[ratelimits.simple]
limit = 6
period = 60

[[ratelimits]]
name = "GC_TOTP_RATE_LIMITER"
namespace_id = "614202610143109"
[ratelimits.simple]
limit = 10
period = 60

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ChatRoom"
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceHub"
[[migrations]]
tag = "v1"
# new_sqlite_classes, not new_classes: the free plan only hosts SQLite-backed
# DOs (both relay DOs are from-scratch and storage-light, so the backing is
# incidental, not a design constraint).
new_sqlite_classes = ["ChatRoom", "PresenceHub"]
