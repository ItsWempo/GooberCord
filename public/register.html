<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GooberCord — dev auth preview</title>
  <link rel="stylesheet" href="/dev-auth.css">
</head>
<body>
  <main>
    <h1>GooberCord</h1>
    <p class="lede">Local preview — create an account and sign in against the real API (this page is a dev stopgap; the full interface is task 11).</p>
    <section>
      <h2>Create account</h2>
      <form id="register-form">
        <label for="reg-username">Username</label>
        <input id="reg-username" name="username" autocomplete="username" maxlength="24" required>
        <label for="reg-password">Password (12–128 characters)</label>
        <input id="reg-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <button type="submit">Create account</button>
      </form>
    </section>
    <section>
      <h2>Sign in</h2>
      <form id="login-form">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" autocomplete="username" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
    </section>
    <p id="feedback" aria-live="polite"></p>
    <p class="whoami" id="whoami"></p>
  </main>
  <script src="/register.js"></script>
</body>
</html>
