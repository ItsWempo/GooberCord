<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GooberCord</title>
  <meta name="description" content="GooberCord — chat for my friends">
  <!-- Favicon: blaxel is the brand face in the app itself, so he is the tab
       icon too (the browser's default /favicon.ico probe was a 404). -->
  <link rel="icon" type="image/png" href="/assets/blaxel.png">
  <!-- Browser chrome follows the effective theme (js/theme.js rewrites these). -->
  <meta name="theme-color" content="#f7efdc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131b27" media="(prefers-color-scheme: dark)">
  <!-- Theme before first paint (CSP-safe: same-origin script, no inline). -->
  <script src="/js/theme-preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <!-- The §4b door-swap: GooberCord renders no Turnstile widget — sign-in and
       registration ride Wempo Accounts' pages. (The former gc-turnstile-sitekey
       meta and public/js/turnstile.js died with login.js; GooberCord's own
       /api/auth/* stay as plumbing.) -->
  <!-- SPA entry. app-build stamp is injected by worker.mjs before the
       closing head element. NOTE: this comment must never contain the raw
       head-close tag bytes — an earlier version of this comment did, and
       the byte-match injected the stale-build stamp into the comment, where
       the doc parsed to nothing (pinned by tests/stale-stamp-comment.test.mjs). -->
  <script type="module" src="/js/boot.js"></script>
</head>
<body>
  <div id="app">
    <noscript><p class="empty-state">GooberCord needs JavaScript to run.</p></noscript>
  </div>
</body>
</html>
