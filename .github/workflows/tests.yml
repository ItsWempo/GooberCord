name: GooberCord tests

on:
  pull_request:
  push:
    branches: [main, "fix/**", "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run test suite
        run: node --test
      - name: Check JavaScript syntax
        run: |
          find api public tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check worker.mjs
